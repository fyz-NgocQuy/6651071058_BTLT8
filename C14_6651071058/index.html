<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Home</title>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!--IMAGE EFFECT-->
    <div class="image-effect" id="image-effect-2">
        <img src="images/off.png" class="fadeEffect">
        <img src="images/on.png">
    </div>

    <!--Switch Button-->
    <div class="switch-btn">
        <div class="onoffswitch">
            <input type="checkbox" name="onoffswitch" class="onoffswitch-checkbox toggle-switch-2" id="myonoffswitch" tabindex="0" checked>
            <label class="onoffswitch-label" for="myonoffswitch">
            <span class="onoffswitch-inner"></span>
            <span class="onoffswitch-switch"></span>
            </label>
        </div>
    </div>

    <script src="js/jquery-latest.min.js"></script>
    
<script>
$(function () {
    var imgs = $('#image-effect-2 img');   // [0] = off.png, [1] = on.png

    $('.toggle-switch-2').on('change', function () {
        imgs.removeClass('fadeEffect');                    // ẩn cả 2 (opacity 0)
        imgs.eq(this.checked ? 1 : 0).addClass('fadeEffect'); // hiện ảnh tương ứng (fade 1.2s)
    }).trigger('change');                                  // đồng bộ trạng thái ban đầu (đang ON)
});
</script>
</body>

</html>
